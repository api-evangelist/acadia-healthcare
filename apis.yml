apis:
  - aid: acadia-healthcare:acadia-healthcare-api
    name: Acadia Healthcare API Gateway
    tags:
      - Behavioral Health
      - Mental Health
      - Healthcare Providers
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://api.acadiahealthcare.com
    humanURL: https://www.acadiahealthcare.com
    description: >-
      An API gateway host operated by Acadia Healthcare, not a published API product. Probed
      2026-08-29: api.acadiahealthcare.com resolves by CNAME to w5rrqr.usa-e2.cloudhub.io (MuleSoft
      CloudHub, US-East-2) over TLS 1.3, and returns HTTP 404 with Content-Length 0 on every
      anonymous path tried, including /openapi.json, /openapi.yaml, /swagger.json, /v1/openapi.json,
      /api-docs, /docs, /redoc and every /.well-known/* path. No OpenAPI, AsyncAPI, GraphQL SDL,
      WSDL, .proto, MCP server or A2A agent card is published on any Acadia Healthcare host, and
      there is no developer portal — the humanURL is the corporate site because no API-facing human
      page exists. Any HL7/FHIR or X12 exchange Acadia participates in is contracted directly and is
      not published. This entry records a real, probed host; it does not assert a consumable API.
