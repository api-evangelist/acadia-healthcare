description: >-
  Acadia Healthcare Company, Inc. (NASDAQ: ACHC) is a Franklin, Tennessee-based Fortune 1000
  behavioral healthcare provider operating a national network of acute inpatient psychiatric
  hospitals, specialty substance use disorder treatment facilities, residential treatment centers,
  and outpatient comprehensive treatment clinics across the United States. It is a clinical services
  operator rather than a software company: as of August 2026 it publishes no developer portal, no API
  reference, and no machine-readable contract of any kind. A MuleSoft CloudHub gateway is deployed at
  api.acadiahealthcare.com, but every anonymous path on it returns an empty-body HTTP 404, and the
  developer host previously recorded here (developer.acadiahealthcare.com) does not resolve. Not to
  be confused with Acadia Pharmaceuticals (NASDAQ: ACAD), an unrelated company.
