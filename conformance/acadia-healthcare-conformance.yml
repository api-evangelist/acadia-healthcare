description: >-
  Standards and regulatory-regime conformance for Acadia Healthcare. Acadia is a US behavioral
  healthcare provider operating inpatient and outpatient treatment facilities, so it is a HIPAA
  covered entity by operation of law and publishes a Notice of Privacy Practices to that effect.
  It publishes NO machine-readable API contract of any kind, so every contract-level conformance
  assertion below is false — not because the provider fails a standard, but because there is no
  contract in which a standard could be declared.
domain_standard:
  declared: false
  standard: null
  evidence: >-
    No OpenAPI, AsyncAPI, GraphQL SDL, WSDL, or .proto is published on any Acadia Healthcare host,
    so there is no contract location in which an HL7v2, FHIR, X12, or NCPDP signature could appear.
    Acadia's clinical and payer integrations are almost certainly HL7/X12 over private channels, but
    nothing published states that, and this pipeline does not assert a standard it cannot see.
