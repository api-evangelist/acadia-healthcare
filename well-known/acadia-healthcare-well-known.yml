description: >-
  Record of the /.well-known/ probe against every host Acadia Healthcare names in apis.yml.
  No well-known document is served on any host. www.acadiahealthcare.com is a WordPress site
  whose 404 handler returns a 404 status with a full HTML error page for every unmatched path,
  so none of these responses carries a document. api.acadiahealthcare.com is a MuleSoft CloudHub
  gateway that answers a bare 404 with an empty body on every anonymous path.
  No WellKnown or SecurityTxt pointer is emitted in apis.yml, because nothing was served.
